[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-hardening-mcp"
version = "0.1.0"
description = "An evidence-driven MCP server for Linux confidentiality audit preparation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Aegis MCP contributors"}]
dependencies = [
  "mcp>=2.3,<3",
  "PyYAML>=6.0.3,<7",
  "jinja2>=3.1.6,<4",
  "filelock>=3.20,<4",
]

[project.scripts]
aegis = "aegis_mcp.cli:main"
aegis-mcp = "aegis_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1", "httpx>=0.28,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
